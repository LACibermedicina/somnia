# Somnia — site Nginx (modelo usado por deploy/setup-vps.sh; __DOMINIO__ é substituído).
# Produção em /  -> 127.0.0.1:3401   |   Homologação em /teste/ -> 127.0.0.1:3402 (o app trata o prefixo via BASE_PATH)
# O Certbot acrescenta o bloco "listen 443 ssl" e o redirecionamento HTTPS ("managed by Certbot").
map $http_upgrade $somnia_conn { default upgrade; '' ''; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    client_max_body_size 64m;          # uploads (20 MB) e importação de jogos (até 60 MB)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # ---- homologação ----
    location = /teste { return 301 /teste/; }
    location ~ ^/teste/api/stream {    # SSE sem buffer
        proxy_pass http://127.0.0.1:3402;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /teste/ {
        proxy_pass http://127.0.0.1:3402;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $somnia_conn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- produção ----
    location /api/stream {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $somnia_conn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
