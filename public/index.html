<head>
<meta charset="utf-8">

<title>Somnia</title>

<style>
:root{--sky1:#bfe6ff;--sky2:#ffe3f1;--panel:#ffffff;--ink:#2a2f55;--mute:#6a7098;--pri:#5b7cff;--pri2:#8a5bff;--sun:#ffc94d;--mint:#47d6a5;--rose:#ff7aa8;--line:#e3e7ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1e2550;--sky2:#3a2450;--panel:#262c5c;--ink:#f1f2ff;--mute:#b3b8e6;--line:#3b4280;color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1e2550;--sky2:#3a2450;--panel:#262c5c;--ink:#f1f2ff;--mute:#b3b8e6;--line:#3b4280;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:16px/1.45 'Fredoka',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--sky1),var(--sky2)) fixed}
.cloud{position:fixed;width:180px;height:60px;border-radius:40px;background:#fff;opacity:.55;filter:blur(2px);animation:drift 40s linear infinite;pointer-events:none;z-index:0}
.cloud:nth-child(2){top:60%;animation-duration:60s;width:240px}
@keyframes drift{from{left:-260px}to{left:110%}}
header,main{position:relative;z-index:1}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 22px}
.logo{font-size:28px;font-weight:700;background:linear-gradient(90deg,var(--pri),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.xp{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:30px;padding:6px 14px;box-shadow:0 6px 0 rgba(91,124,255,.18)}
.bar{width:110px;height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--rose));transition:width .6s cubic-bezier(.3,1.6,.5,1)}
nav{display:flex;gap:8px;padding:0 22px 8px;overflow-x:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.tab{padding:9px 18px;border-radius:24px;background:var(--panel);box-shadow:0 5px 0 rgba(91,124,255,.18);transition:transform .15s}
.tab:hover{transform:translateY(-2px)}.tab.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn{padding:10px 20px;border-radius:24px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600;box-shadow:0 5px 0 #3f55c4;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3f55c4}.btn.alt{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--line)}.btn.ok{background:var(--mint);box-shadow:0 5px 0 #25a07a}.btn.bad{background:var(--rose);box-shadow:0 5px 0 #c9507c}
.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{max-width:1150px;margin:0 auto;padding:10px 22px 50px}
.panel{background:var(--panel);border-radius:26px;padding:20px;box-shadow:0 8px 0 rgba(91,124,255,.15)}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
textarea{min-height:90px;resize:vertical}label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.ask{display:flex;gap:10px;flex-wrap:wrap}.ask input{flex:1;min-width:220px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:6px 14px;border-radius:20px;background:var(--panel);border:2px solid var(--line)}.chip.on{background:var(--sun);border-color:var(--sun);color:#3a2b00}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;margin-top:10px}
.card{position:relative;text-align:left;background:var(--panel);border-radius:22px;padding:10px;border:4px solid var(--c);box-shadow:0 8px 0 var(--c),0 18px 24px rgba(40,50,120,.15);transition:transform .2s;transform-style:preserve-3d;animation:pop .5s backwards}
.card:hover{transform:translateY(-8px) rotate(-1.5deg) scale(1.03)}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
.art{height:120px;border-radius:14px;display:grid;place-items:center;font-size:56px;margin-bottom:8px;position:relative;overflow:hidden}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
.card:hover .art:after{transform:translateX(120%)}.art span{animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
@keyframes bob{50%{transform:translateY(-6px)}}
.card b{display:block;font-size:17px}.card small{color:var(--mute)}.card i{position:absolute;top:-4px;right:12px;background:var(--c);color:#fff;font-style:normal;font-size:12px;padding:2px 10px;border-radius:0 0 10px 10px}
.r-Comum{--c:#8fa0c8}.r-Rara{--c:#47b4ff}.r-Épica{--c:#a56bff}.r-Lendária{--c:#ffb300}
.pend{opacity:.7;outline:3px dashed var(--rose)}
.modal{position:fixed;inset:0;z-index:5;background:rgba(30,35,90,.55);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}.modal .panel{max-width:620px;width:100%;max-height:90vh;overflow:auto;animation:flip .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes flip{from{transform:rotateY(90deg) scale(.7)}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.drop{border:3px dashed var(--pri);border-radius:22px;padding:22px;text-align:center;background:rgba(91,124,255,.07);transition:.2s}.drop.over{background:rgba(255,201,77,.3);transform:scale(1.02)}
.tag{display:inline-block;background:var(--line);border-radius:12px;padding:1px 10px;margin:2px;font-size:13px}
.hint{color:var(--mute);font-size:14px}.msg{padding:10px 14px;border-radius:16px;background:var(--line);margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 22px;border-radius:24px;z-index:9;animation:pop .4s}
.lab{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;margin-top:14px}@media(max-width:760px){.lab{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* === Tema aventura D&D + HQ/mangá + Pixar, menu estilo macOS === */
:root,:root[data-theme="light"]{--sky1:#fff1cf;--sky2:#ffd6e6;--panel:#fffdf5;--ink:#1c1630;--mute:#5d5575;--pri:#d9342b;--pri2:#7b2fe0;--sun:#ffc21a;--mint:#2fc79a;--rose:#ff5c8a;--line:#efe3c8;color-scheme:light}
body{font-family:'Fredoka',system-ui,sans-serif;background:radial-gradient(circle at 1px 1px,rgba(28,22,48,.13) 1.3px,transparent 1.7px) 0 0/14px 14px,linear-gradient(160deg,var(--sky1),var(--sky2)) fixed}
h1,h2,h3,.hd,.logo{font-family:'Bangers','Fredoka',sans-serif;letter-spacing:.06em;font-weight:400;color:var(--ink)}
.hd{font-size:26px}
header{position:sticky;top:0;z-index:4;padding:6px 18px;background:rgba(255,253,245,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:3px solid var(--ink)}
.logo{font-size:30px;background:none;-webkit-text-fill-color:var(--pri);color:var(--pri);text-shadow:2px 2px 0 var(--ink)}
.xp{background:transparent;box-shadow:none;border-radius:0;padding:0;font-size:14px;flex-wrap:wrap}
.coin{background:var(--sun);border:3px solid var(--ink);border-radius:20px;padding:1px 12px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.panel,.card,.msg,.chip,.tab,input,textarea,select{border:3px solid var(--ink)}
.panel{border-radius:16px;box-shadow:6px 6px 0 var(--ink);transition:transform .15s ease-out,box-shadow .2s;transform-style:preserve-3d;will-change:transform}
.msg{border-radius:14px;background:var(--line)}
.msg.lock{background:repeating-linear-gradient(45deg,#fff3c4,#fff3c4 10px,#ffe59a 10px,#ffe59a 20px)}
input,textarea,select{border-radius:12px;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;background:#fff}
input:focus,textarea:focus,select:focus{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--pri2);outline:none}
.btn,.tab,.chip{border:3px solid var(--ink)}
.btn{background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--ink);font-weight:600;border-radius:14px}
.btn:hover{transform:translateY(-2px) rotate(-.6deg)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--ink)}.btn.ok{background:var(--mint);color:var(--ink);box-shadow:0 5px 0 var(--ink)}.btn.bad{background:var(--rose);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.tab{background:var(--panel);box-shadow:2px 2px 0 var(--ink);border-radius:16px;padding:4px 12px}
.chip{border-radius:14px;padding:3px 12px;font-size:14px}.chip.on{background:var(--sun);border-color:var(--ink);color:var(--ink)}
.card{border-color:var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--c)}
.card i{border:2px solid var(--ink);border-top:0;font-family:'Bangers',sans-serif;letter-spacing:.05em}
.art{border:3px solid var(--ink)}
.bar{border:2px solid var(--ink);height:12px;background:#fff}.bar i{background:linear-gradient(90deg,var(--sun),var(--rose))}
.tag{border:2px solid var(--ink);background:var(--panel)}
.modal .panel{max-width:660px}
.toast{background:var(--sun);color:var(--ink);border:4px solid var(--ink);border-radius:8px;font-family:'Bangers',sans-serif;font-size:20px;letter-spacing:.05em;transform:translateX(-50%) rotate(-2deg);box-shadow:5px 5px 0 var(--ink);clip-path:none;padding:8px 26px}
main{padding-bottom:180px}
#nav{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding:0 10px;pointer-events:none}
.dock{pointer-events:auto;display:flex;gap:6px;align-items:flex-end;padding:8px 12px;max-width:100%;flex-wrap:wrap;justify-content:center;background:rgba(255,253,245,.62);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink)}
.dock::-webkit-scrollbar{display:none}
.dk{position:relative;flex:0 0 auto;width:54px;height:54px;background:linear-gradient(160deg,#fff,#ffe9b8);border:3px solid var(--ink);border-radius:15px;display:grid;place-items:center;padding:0;transition:transform .12s ease-out;transform-origin:bottom center}
.dk b{font-size:28px;line-height:1;font-weight:400;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.dk em{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-style:normal;font-size:12px;padding:2px 9px;border-radius:8px;white-space:nowrap;transition:.15s}
.dk:hover em,.dk:focus-visible em{opacity:1;transform:translateX(-50%) scale(1)}
.dk.on{background:linear-gradient(160deg,var(--sun),#ff9d4a)}.dk.on:after{content:"";position:absolute;bottom:-9px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.dk.on b{animation:dockb .6s}
@keyframes dockb{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
.login{max-width:480px;margin:14px auto}
.big{font:400 64px 'Bangers',sans-serif;color:var(--pri);text-shadow:3px 3px 0 var(--ink)}
.sheet{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,#fffdf5,#fff0c9)}
.sheet .attrs{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.sheet .attrs{grid-template-columns:repeat(2,1fr)}}
.at{text-align:center;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px;box-shadow:3px 3px 0 var(--ink)}
.at b{display:block;font:400 30px 'Bangers',sans-serif}
.d20{width:76px;height:76px;display:grid;place-items:center;font:400 30px 'Bangers',sans-serif;background:var(--mint);border:4px solid var(--ink);clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);animation:spin 6s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(14deg) scale(1.08)}}
.ach{text-align:left;transition:transform .2s}.ach:hover{transform:translateY(-4px) rotate(-1deg)}.ach.done{background:#eafff5}
.hero-in{animation:pop .5s backwards}
@media (prefers-reduced-motion:reduce){.d20,.dk b{animation:none!important}}

.cloud{display:none}

.tab,.chip{border:2px solid rgba(130,115,210,.4);box-shadow:none}

/* menu sem fundo, orbes 3D estilo Pixar */
.dock{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;gap:10px;padding:0 6px}
.dk,.dk.on{background:radial-gradient(circle at 32% 26%,#fff 0 6%,hsl(var(--h,260) 100% 88%) 7%,hsl(var(--h,260) 85% 70%) 45%,hsl(var(--h,260) 70% 48%) 100%)}
.dk{width:62px;height:62px;border:0;border-radius:50%;box-shadow:inset -5px -7px 12px rgba(0,0,0,.22),inset 4px 5px 8px rgba(255,255,255,.55),0 12px 14px rgba(40,30,100,.28)}
.dk:before{content:"";position:absolute;left:14%;top:9%;width:36%;height:22%;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-25deg)}

/* === v5: cenários (místico, espacial, mágico, mangá, low poly) === */
:root,html[data-scenario=mistico]{--bgall:radial-gradient(circle at 20% 15%,rgba(124,245,208,.16),transparent 40%),radial-gradient(circle at 80% 70%,rgba(139,108,255,.22),transparent 45%),linear-gradient(180deg,#070b1f,#1b1450 55%,#0f3a4a);--bgink:#f1eeff;--panel:#1b1838;--panel2:#2a2552;--field:#120f2b;--ink:#f1eeff;--mute:#bdb8e6;--edge:#6f63d9;--bw:2px;--rad:18px;--shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 1px rgba(124,245,208,.12);--acc:#6e4bf0;--acc2:#5b3fd0;--accink:#fff;--accsh:#2a1a80;--ok:#3de0c5;--okink:#06241f;--bad:#ff7a96;--badink:#2a0712;--chipon:#ffd24d;--chiponink:#1b1500;--link:#8fe3ff;--coin:#ffd24d;--coinink:#1b1500;--lock1:#2d2760;--lock2:#231f4e;--head:rgba(11,16,38,.92);--headfont:'Cinzel',Georgia,serif;--hls:.02em;--orbf:none;--orbglow:0 0 18px rgba(124,245,208,.55);color-scheme:dark}
html[data-scenario=espacial]{--bgall:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent) 0 0/240px 200px,radial-gradient(1px 1px at 120px 80px,#9ff0ff,transparent) 0 0/240px 200px,radial-gradient(1.5px 1.5px at 200px 160px,#fff,transparent) 0 0/240px 200px,radial-gradient(ellipse at 75% 15%,rgba(0,212,255,.2),transparent 45%),radial-gradient(ellipse at 15% 85%,rgba(255,62,165,.15),transparent 45%),linear-gradient(180deg,#02030d,#0a1030 55%,#061a3a);--bgink:#e8f4ff;--panel:#0d1433;--panel2:#17204d;--field:#070b22;--ink:#e8f4ff;--mute:#a9bddb;--edge:#19c6f5;--bw:2px;--rad:10px;--shadow:0 0 0 1px rgba(25,198,245,.25),0 0 28px rgba(25,198,245,.22);--acc:#0971cc;--acc2:#0a58a8;--accink:#fff;--accsh:#043466;--ok:#34f0b0;--okink:#03241a;--bad:#ff5c8a;--badink:#2a0612;--chipon:#ff3ea5;--chiponink:#1a0010;--link:#7fe0ff;--coin:#00d4ff;--coinink:#00212b;--lock1:#14204f;--lock2:#0f1840;--head:rgba(5,8,32,.92);--headfont:'Orbitron','Inter',sans-serif;--hls:.04em;--orbf:none;--orbglow:0 0 20px rgba(0,212,255,.7);color-scheme:dark}
html[data-scenario=magico]{--bgall:radial-gradient(2px 2px at 40px 60px,#ffe27a,transparent) 0 0/200px 180px,radial-gradient(1.5px 1.5px at 150px 120px,#fff,transparent) 0 0/200px 180px,linear-gradient(180deg,#2a0a55,#6a1b9a 55%,#b3237a);--bgink:#fff;--panel:#fff7ea;--panel2:#ffe3f3;--field:#fff;--ink:#2a1040;--mute:#5a3d73;--edge:#b3237a;--bw:2px;--rad:26px;--shadow:0 12px 34px rgba(42,10,85,.45);--acc:#b3237a;--acc2:#8a1a78;--accink:#fff;--accsh:#4a0f48;--ok:#3ddc97;--okink:#06281a;--bad:#d61f4f;--badink:#fff;--chipon:#ffc233;--chiponink:#2a1a00;--link:#8a1a78;--coin:#ffc233;--coinink:#2a1a00;--lock1:#fff0b8;--lock2:#ffe38a;--head:rgba(255,247,234,.96);--headfont:'Fredoka','Inter',sans-serif;--hls:0;--orbf:none;--orbglow:0 0 22px rgba(255,194,51,.8);color-scheme:light}
html[data-scenario=manga]{--bgall:radial-gradient(circle at 1px 1px,rgba(0,0,0,.2) 1.4px,transparent 1.8px) 0 0/10px 10px,repeating-conic-gradient(from 90deg at 50% 120%,#fff 0 3deg,#ececec 3deg 6deg);--bgink:#000;--panel:#fff;--panel2:#f1f1f1;--field:#fff;--ink:#000;--mute:#333;--edge:#000;--bw:3px;--rad:4px;--shadow:6px 6px 0 #000;--acc:#d90429;--acc2:#b30322;--accink:#fff;--accsh:#000;--ok:#ffe14a;--okink:#000;--bad:#000;--badink:#fff;--chipon:#000;--chiponink:#fff;--link:#b30322;--coin:#ffe14a;--coinink:#000;--lock1:#f5f5f5;--lock2:#e0e0e0;--head:#fff;--headfont:'Bangers','Inter',sans-serif;--hls:.05em;--orbf:grayscale(1) contrast(1.2);--orbglow:none;color-scheme:light}
html[data-scenario=lowpoly]{--bgall:linear-gradient(135deg,rgba(255,255,255,.07) 25%,transparent 25%) 0 0/80px 80px,linear-gradient(225deg,rgba(0,0,0,.14) 25%,transparent 25%) 0 0/80px 80px,linear-gradient(180deg,#17323f,#235a63 55%,#8a4a2e);--bgink:#fff;--panel:#f6f0e2;--panel2:#eadfc8;--field:#fffaf0;--ink:#1e2a33;--mute:#4a5560;--edge:#1e2a33;--bw:2px;--rad:3px;--shadow:5px 5px 0 rgba(0,0,0,.35);--acc:#c2410c;--acc2:#9a3412;--accink:#fff;--accsh:#4a1a06;--ok:#5fd3c4;--okink:#052b27;--bad:#b4234a;--badink:#fff;--chipon:#f4a261;--chiponink:#1e1200;--link:#9a3412;--coin:#f4a261;--coinink:#1e1200;--lock1:#f7e3b0;--lock2:#efd48c;--head:rgba(246,240,226,.97);--headfont:'Inter',sans-serif;--hls:0;--orbf:none;--orbglow:none;color-scheme:light}
html{background:#000}
body{background:var(--bgall);background-attachment:fixed;color:var(--ink)}
header{background:var(--head);border-bottom:var(--bw) solid var(--edge);color:var(--ink)}
.logo{font-family:var(--headfont);letter-spacing:var(--hls);color:var(--link);-webkit-text-fill-color:var(--link)}
.xp{color:var(--ink)}
h1,h2,h3,.hd{font-family:var(--headfont);letter-spacing:var(--hls);color:var(--ink)}
#app>h3,#app>p,#app>.hint,#app>.chips+p{color:var(--bgink)}
a{color:var(--link)}
.panel{background:var(--panel);color:var(--ink);border:var(--bw) solid var(--edge);border-radius:var(--rad);box-shadow:var(--shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
.msg{background:var(--panel2);color:var(--ink)}
.msg.lock{background:repeating-linear-gradient(45deg,var(--lock1),var(--lock1) 10px,var(--lock2) 10px,var(--lock2) 20px);color:var(--ink)}
label,.hint{color:var(--mute)}
input,textarea,select{background:var(--field);color:var(--ink);border:var(--bw) solid var(--edge);border-radius:calc(var(--rad)*.6)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.85}
:focus-visible{outline:3px solid var(--chipon);outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:var(--chipon);box-shadow:0 0 0 3px var(--chipon)}
.btn{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--accink);border:var(--bw) solid var(--edge);border-radius:calc(var(--rad)*.7);box-shadow:0 4px 0 var(--accsh)}
.btn.alt{background:var(--panel);color:var(--ink);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge)}
.btn.ok{background:var(--ok);color:var(--okink);box-shadow:0 4px 0 var(--edge)}
.btn.bad{background:var(--bad);color:var(--badink);box-shadow:0 4px 0 var(--edge)}
.tab,.chip{background:var(--panel);color:var(--ink);border:2px solid var(--edge);box-shadow:none}
.chip.on{background:var(--chipon);color:var(--chiponink);border-color:var(--chipon)}
.tag{background:var(--panel2);color:var(--ink);border:1px solid var(--edge)}
.card{background:var(--panel);color:var(--ink);border-radius:calc(var(--rad)*.9)}
.card b{color:var(--ink)}.card small{color:var(--mute)}
.bar{background:var(--panel2);border:1px solid var(--edge)}
.coin{background:var(--coin);color:var(--coinink);border:2px solid var(--edge)}
.at,.sheet,.ach.done{background:var(--panel2);color:var(--ink)}
.big{color:var(--link);text-shadow:none}
.d20{background:var(--ok);color:var(--okink)}
.toast{background:var(--panel);color:var(--ink);border:2px solid var(--edge);font-family:var(--headfont)}
.mu-help,.mu-tip{background:var(--panel);color:var(--ink);border:2px solid var(--edge)}
.mu-tip small{color:var(--mute)}
.mu-dpad button{background:var(--panel);color:var(--ink);border:2px solid var(--edge)}
.scn-sel{padding:4px 10px;max-width:140px}
.scn-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dk{filter:var(--orbf);box-shadow:inset -5px -7px 12px rgba(0,0,0,.25),inset 4px 5px 8px rgba(255,255,255,.5),0 10px 14px rgba(0,0,0,.35),var(--orbglow)}
.dk.on{outline:3px solid var(--chipon)}
html[data-scenario=lowpoly] .dk{border-radius:22%}
html[data-scenario=lowpoly] .panel{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
html[data-scenario=manga] .panel,html[data-scenario=manga] .card{border-width:3px}
html[data-scenario=manga] h2,html[data-scenario=manga] .hd{font-size:26px}
html[data-scenario=espacial] h2,html[data-scenario=espacial] .hd{font-size:18px}
html[data-scenario=mistico] h2,html[data-scenario=mistico] .hd{font-size:21px}
.mu-map{position:absolute;left:10px;top:10px;width:140px;height:140px;border-radius:50%;border:3px solid var(--edge);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
@media(max-width:560px){.mu-map{width:96px;height:96px}}
/* === marketplace e administração === */
.mk-hero{display:grid;grid-template-columns:minmax(200px,380px) 1fr;padding:0;overflow:hidden}
.mk-hero .hero-art{width:100%;height:100%;min-height:220px;object-fit:cover;border-radius:0;font-size:90px}
.mk-hero .tx{padding:22px}@media(max-width:700px){.mk-hero{grid-template-columns:1fr}}
.mk-bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}.mk-bar input{flex:1;min-width:200px}.mk-bar select{width:auto}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:6px}
.gcard{text-align:left;background:var(--panel);color:var(--ink);border:var(--bw) solid var(--edge);border-radius:var(--rad);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .15s;display:flex;flex-direction:column}
.gcard:hover{transform:translateY(-5px)}
.gcard img,.gcard .gc-art{width:100%;aspect-ratio:16/10;object-fit:cover;display:grid;place-items:center;font-size:52px;border-radius:0}
.gc-art{display:grid;place-items:center}
.gc-b{padding:12px 14px;display:flex;flex-direction:column;gap:4px}.gc-b small{color:var(--mute)}.gc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.price{background:var(--coin);color:var(--coinink);border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.price.free{background:var(--ok);color:var(--okink)}
.kind{font-size:11px;border:1px solid var(--edge);border-radius:6px;padding:0 6px;color:var(--mute)}
.rt small{color:var(--mute)}.st{color:var(--coin);letter-spacing:1px}
.m-art{width:100%;max-height:220px;object-fit:cover;border-radius:calc(var(--rad)*.7);display:grid;place-items:center;font-size:72px;height:160px}
.rate{margin:8px 0}.star{background:transparent;border:0;font-size:26px;color:var(--mute);padding:0 2px}.star.on,.star:hover{color:var(--coin)}
.reader{white-space:pre-wrap;background:var(--panel2);color:var(--ink);padding:12px;border-radius:12px;max-height:40vh;overflow:auto;font-size:14px;margin-top:10px}
.adm{display:grid;grid-template-columns:230px 1fr;gap:18px}@media(max-width:860px){.adm{grid-template-columns:1fr}.adm-nav{position:static!important;flex-direction:row!important;flex-wrap:wrap}}
.adm-nav{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:4px;padding:10px}
.adm-i{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px;border-radius:calc(var(--rad)*.6);background:transparent;color:var(--ink);border:0;font-weight:500}
.adm-i:hover{background:var(--panel2)}.adm-i.on{background:var(--acc);color:var(--accink)}
.adm-i .n{margin-left:auto;background:var(--chipon);color:var(--chiponink);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.adm-main>.panel{margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{display:flex;gap:12px;align-items:center;background:var(--panel);color:var(--ink);border:var(--bw) solid var(--edge);border-radius:var(--rad);padding:14px;box-shadow:var(--shadow)}
.kpi .ico{font-size:26px;width:48px;height:48px;display:grid;place-items:center;background:var(--panel2);border-radius:12px;flex:0 0 auto}
.kpi small{display:block;color:var(--mute)}.kpi b{font-size:24px;line-height:1.15}.kpi em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}.charts .panel{margin:0}
.chart{width:100%;height:auto;margin-top:6px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.hb i{display:block;height:12px;background:var(--link);border-radius:6px}.hb span{min-width:100px}
.grow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge)}
.grow>img,.grow>.gc-art{width:56px;height:40px;object-fit:cover;border-radius:8px;font-size:22px;aspect-ratio:auto}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.acts .btn{padding:4px 12px;font-size:13px}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.adm-link{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:0;border-radius:10px;padding:10px 12px;margin:6px 0}.adm-link b{background:var(--chipon);color:var(--chiponink);border-radius:999px;min-width:28px;text-align:center;padding:0 8px}
.tbl{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}.tbl th,.tbl td{border:1px solid var(--edge);padding:6px 10px;text-align:left;color:var(--ink)}.tbl th{background:var(--panel2)}
#gplay{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
#gplay .gp-bar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);color:var(--ink)}#gplay .gp-bar b{flex:1}
#gplay iframe{flex:1;border:0;width:100%;background:#000}
/* === Área de trabalho estilo macOS === */
body{overflow:hidden}
header{position:fixed;top:0;left:0;right:0;height:30px;padding:0 8px;z-index:8;display:flex;align-items:center;background:var(--head);color:var(--ink);border-bottom:1px solid rgba(0,0,0,.28);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 10px rgba(0,0,0,.3)}
header .logo{display:none;font-size:15px;margin-left:6px}header:has(#hud:empty) .logo{display:block}
#hud{display:flex;flex:1;min-width:0}
.mbar{display:flex;align-items:center;gap:2px;width:100%;font-size:13px;color:var(--ink)}
.mb-wrap{position:relative}
.mb-btn{background:transparent;color:var(--ink);border:0;padding:3px 10px;border-radius:6px;font-size:13px;box-shadow:none}.mb-btn:hover,.mb-btn.open{background:var(--panel2)}
.mb-menu{position:absolute;top:calc(100% + 5px);left:0;min-width:240px;background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.5);padding:6px;z-index:9;max-height:72vh;overflow:auto}
.mb-item{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;padding:6px 10px;border-radius:6px;font-size:13px;text-decoration:none;box-shadow:none}
.mb-item:hover,.mb-item:focus-visible{background:var(--acc);color:var(--accink)}
.mb-sep{height:1px;background:var(--edge);opacity:.45;margin:5px 4px}.mb-lab{font-size:11px;color:var(--mute);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.05em}

 $('#hud').innerHTML=`<nav class="mbar" aria-label="Barra de menus">${menu('app','🌙 <b>Somnia</b>',mi('tab','jornada','Minha jornada')+mi('tab','carteira','Carteira')+sep+'<div class="mb-lab">Cenário</div>'+sc+sep+(SRV()?'<a class="mb-item" role="menuitem" href="/manual" target="_blank" rel="noopener">Manual do usuário</a><a class="mb-item" role="menuitem" href="/mascote" target="_blank" rel="noopener">Conhecer o mascote</a>'+mi('pwd',undefined,'Alterar senha…')+sep:'')+mi('logout',undefined,'Sair'))}${menu('ir','Ir',allApps().map(a=>mi('tab',a[0],a[1]+' '+a[2])).join(''))}${menu('jan','Janela',mi('tab','inicio','Área de trabalho')+mi('wmax',undefined,S.wmax?'Restaurar tamanho':'Maximizar')+mi('lpad',undefined,'Todos os aplicativos'))}<span class="mb-sp"></span><span class="mb-x coin" title="Créditos disponíveis">🪙 ${avail(C.uid)}</span><span class="mb-x">Nv ${lvl()}</span><span class="mb-x bar" aria-hidden="true"><i style="width:${p}%"></i></span><span class="mb-x" id="mb-clock">${t}</span><span class="mb-x">${E(C.name)}${isAdmin()?' 👑':''}</span></nav>`}
setInterval(()=>{const c=document.getElementById('mb-clock');if(c)c.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},20000);
function deskIcons(){const g=S.st.games.filter(x=>x.status==='publicado'&&inst().has(x.id)&&gOwn(x)),
 ic=(id,art,label)=>`<button class="di ${S.dsel===id?'sel':''}" data-a="dsel" data-v="${id}" data-open="${id}" aria-label="${E(label)}"><span class="di-ic">${art}</span><span class="di-l">${E(label)}</span></button>`;
 return ic('museu','<span class="di-e" style="background:linear-gradient(160deg,#9fb4ff,#5b3fd0)">🏛️</span>','Aventura no Museu')+g.map(x=>ic('g:'+x.id,x.cover?`<img src="${E(x.cover)}" alt="">`:`<span class="di-e" style="background:${grad(x.genre||x.title)}">${gEmoji(x)}</span>`,x.title)).join('')+ic('loja','<span class="di-e" style="background:linear-gradient(160deg,#ffd24d,#ff8a4d)">＋</span>','Instalar jogos')}
function openIcon(id){if(id==='museu')S.tab='museu';else if(id==='loja')S.tab='loja';else if(id.startsWith('g:')){const g=byId('games',id.slice(2));if(!g)return;if(g.kind==='standalone')ACT2.gplay(g.id);else if(g.kind==='external'&&g.url)window.open(g.url,'_blank','noopener,noreferrer');else{S.tab='loja';S.gm=g.id;S.gread=g.id}}S.dsel=null;render()}
const lpadHtml=()=>`<div class="lp-grid" role="menu" aria-label="Todos os aplicativos">${allApps().map(a=>`<button class="lp-i" role="menuitem" data-a="tab" data-v="${a[0]}"><span class="lp-ic" style="--h:${a[4]}"><b>${a[1]}</b></span><span class="lp-l">${E(a[2])}</span></button>`).join('')}</div><p class="lp-h">Toque fora ou pressione Esc para fechar</p>`;
function shellSync(){const home=S.tab==='inicio',mus=S.tab==='museu',login=!S.auth,w=document.getElementById('win');
 if(w){w.style.display=((home||mus)&&!login)?'none':'flex';w.classList.toggle('max',!!S.wmax||S.tab==='admin');document.getElementById('win-title').textContent='Somnia — '+(login?'Entrar':(APP[S.tab]?APP[S.tab][2]:'Somnia'))}
 const d=document.getElementById('desk');if(d){const show=!(mus&&!login);d.style.display=show?'block':'none';wallRun(show)}
 const di=document.getElementById('dicons');if(di)di.innerHTML=login?'':deskIcons();
 const lp=document.getElementById('lpad');if(lp){const on=!!S.lp&&!login;lp.style.display=on?'flex':'none';lp.innerHTML=on?lpadHtml():''}}
(function(){const app=document.getElementById('app'),w=document.createElement('div');w.id='win';
 w.innerHTML='<div class="win-bar"><div class="tl"><button class="tl-c" data-a="wclose" aria-label="Fechar janela"></button><button class="tl-m" data-a="wclose" aria-label="Minimizar para a área de trabalho"></button><button class="tl-z" data-a="wmax" aria-label="Maximizar ou restaurar janela"></button></div><div class="win-title" id="win-title">Somnia</div><div class="tl-sp"></div></div><div class="win-body" id="win-body"></div>';
 app.parentNode.insertBefore(w,app);document.getElementById('win-body').appendChild(app);
 const d=document.createElement('div');d.id='desk';d.innerHTML='<canvas id="wall" aria-hidden="true"></canvas><div id="dicons" role="group" aria-label="Área de trabalho: jogos instalados"></div>';document.body.insertBefore(d,document.body.firstChild);
 const lp=document.createElement('div');lp.id='lpad';lp.setAttribute('data-a','lpad');document.body.appendChild(lp);
 d.addEventListener('click',e=>{if(e.target===d||e.target.id==='dicons'||e.target.id==='wall'){S.dsel=null;shellSync()}})})();
Object.assign(ACT2,{mo:v=>{S.mo=S.mo===v?null:v},lpad:()=>{S.lp=!S.lp},wmax:()=>{S.wmax=!S.wmax},wclose:()=>{S.tab='inicio';S.wmax=false},
 dsel:v=>{S.dsel=v;if(matchMedia('(pointer:coarse)').matches)openIcon(v)},
 ginst:v=>{instAdd(v);toast('Instalado na área de trabalho')},grem:v=>{inst().delete(v);instSave();toast('Removido da área de trabalho')}});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a]'),a=b&&b.dataset.a;if(a!=='mo'&&S.mo){S.mo=null;if(!b)hud()}if(a!=='lpad'&&a!=='tab'&&S.lp&&b)S.lp=false;if(a==='tab'&&S.lp)S.lp=false;if(a==='tab'&&!S.wmax)S.wmax=false},true);
document.addEventListener('dblclick',e=>{const b=e.target.closest&&e.target.closest('[data-open]');if(b)openIcon(b.dataset.open)});
document.addEventListener('keydown',e=>{const f=document.activeElement;if((e.key==='Enter'||e.key===' ')&&f&&f.classList&&f.classList.contains('di')){e.preventDefault();openIcon(f.dataset.open);return}
 if(e.key!=='Escape'||!S.auth)return;if(f&&f.matches&&f.matches('input,textarea,select'))return;if(S.mo){S.mo=null;hud();return}if(S.lp){S.lp=false;render();return}
 if(S.modal||S.gm||document.getElementById('gplay'))return;if(S.tab!=='inicio'&&S.tab!=='museu'){S.tab='inicio';S.wmax=false;render()}});

function render(){S.me=S.st.users.find(u=>u.id===C.uid)||null;muSync();shellSync();if(!S.auth){if(!$('.login')||S.lrm!==S.lmode){S.lrm=S.lmode;loginView()}return}view();const c=S.st.cards.find(x=>x.id===S.modal);const gm=S.gm&&byId('games',S.gm);$('#over').innerHTML=c?modal(c):gm?gameModal(gm):''}
async function aiJson(prompt){try{const r=await C.sample.json(prompt);return r}catch(e){return null}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.tagName==='A')e.preventDefault();if(b.dataset.a==='close'&&e.target.closest('[data-stop]')&&!b.matches('button'))return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='tab'){S.tab=v;S.grp=null}else if(a==='deck'){S.deck=v;S.res=null}else if(a==='open')S.modal=v;else if(a==='close'){S.modal=null;S.gm=null}
 else if(a==='demoadm')S.demoAdmin=!S.demoAdmin;else if(a==='clear'){S.res=null;S.q=''}
 else if(a==='collect'){if(!S.prog.got.includes(v)){S.prog.got.push(v);const c=S.st.cards.find(x=>x.id===v);const all=visible().filter(x=>x.deck===c.deck);const done=all.every(x=>S.prog.got.includes(x.id));gain(10,'carta coletada');if(done&&all.length>1)gain(50,'deck completo!')}}
 else if(a==='search'){const q=$('#q').value.trim();if(!q)return;S.q=q;const all=visible();S.busy=true;render();let ids=null;
  if(C.sample){const r=await aiJson(`Você ajuda a buscar cartas. Pedido do usuário: "${q}". Cartas (JSON): ${JSON.stringify(all.map(c=>({id:c.id,t:c.title,d:c.deck,s:c.summary,g:c.tags})))}. Responda só um array JSON com os ids das cartas relevantes, da mais à menos relevante, no máximo 12.`);if(Array.isArray(r))ids=r.filter(x=>all.some(c=>c.id===x))}
  if(!ids)ids=all.map(c=>[c,score(c,q)]).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]).map(x=>x[0].id);S.res=ids;S.busy=false}
 else if(a==='seed'){for(const s of SEED)await put('cards',uid(),{...s,status:'publicada',author:C.uid,files:[],ts:Date.now()});for(const b of BIB)await put('biblio',uid(),b);if(!S.st.groups.length)await put('groups',uid(),{name:'Amantes do Sono e Pesadelos',theme:'Sono e Pesadelos',desc:'Conversas sobre mitos e relatos noturnos.',members:[],owner:C.uid})}
 else if(a==='approve'){const c=S.st.cards.find(x=>x.id===v);const{id,...r}=c;await put('cards',v,{...r,status:'publicada'});toast('Carta aprovada')}
 else if(a==='rm'){if(confirm('Excluir esta carta?'))await del('cards',v)}
 else if(a==='pick'){$('#fi').click();return}
 else if(a==='ai'){S.desc=$('#desc').value;const nm=S.files.map(f=>f.name).join(', ');if(!S.desc.trim()&&!nm){toast('Descreva o item ou envie arquivos.');return}
  if(!C.sample){toast('IA indisponível. Preencha os campos manualmente.');return}
  S.busy=true;render();const r=await aiJson(`Estruture uma carta de colecionável educativa a partir da descrição e dos nomes de arquivos. Descrição: "${S.desc}". Arquivos: ${nm||'nenhum'}. Não invente fatos nem fontes; se faltar informação, escreva "a verificar". Responda só um objeto JSON com: title, deck (contexto temático), rarity (Comum, Rara, Épica ou Lendária), summary (1 frase), history (2-3 frases), details (3-5 frases), tags (array de até 5). Em português.`);S.busy=false;if(r&&r.title)S.draft=r;else toast('A IA não respondeu. Preencha manualmente.')}
 else if(a==='send'){if(!await chargePublish())return;const g=id=>$(id).value.trim();if(!g('#n-title')||!g('#n-deck')||!g('#n-sum')){toast('Título, deck e resumo são obrigatórios.');return}
  const files=[];for(const f of S.files){const o={name:f.name};try{if(C.assets){const r=await C.assets.upload(f);o.url=r.url}}catch(x){}files.push(o)}
  await put('cards',uid(),{title:g('#n-title'),deck:g('#n-deck'),rarity:$('#n-rar').value,tags:g('#n-tags').split(',').map(s=>s.trim()).filter(Boolean),summary:g('#n-sum'),history:g('#n-his'),details:g('#n-det'),files,author:C.uid,status:isAdmin()?'publicada':'pendente',ts:Date.now()});
  S.files=[];S.draft=null;S.desc='';S.tab='cartas';gain(30,isAdmin()?'carta publicada':'carta enviada para aprovação')}
 else if(a==='mkgrp'){const g=id=>$(id).value.trim();if(!g('#gn')||!g('#gt')){toast('Informe nome e tema.');return}await put('groups',uid(),{name:g('#gn'),theme:g('#gt'),desc:g('#gd'),members:[C.uid],owner:C.uid});toast('Comunidade criada')}
 else if(a==='grp')S.grp=v;else if(a==='back')S.grp=null;
 else if(a==='join'){const g=S.st.groups.find(x=>x.id===v);const{id,...r}=g;const m=r.members||[];r.members=m.includes(C.uid)?m.filter(x=>x!==C.uid):[...m,C.uid];await put('groups',v,r)}
 else if(a==='post'){const t=$('#pm').value.trim();if(!t)return;await put('posts',uid(),{gid:S.grp,name:C.name,author:C.uid,text:t,ts:Date.now()});gain(5,'mensagem publicada')}
 else if(ACT2[a]){await ACT2[a](v,b)}
 render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q')document.querySelector('[data-a=search]').click();if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
(async()=>{render();const T=p=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),10000))]);
 try{if(!window.claude)return;
  const [db,u,sm,as,dl]=await Promise.all(['db','user','sample','assets','downloads'].map(n=>T(claude.use(n)).catch(()=>null)));
  C.sample=sm;C.assets=as;C.usr=u;C.dl=dl;
  if(u){try{const me=await u.me();C.name=me.name||'Você';C.admin=await u.canEdit();C.uid=(await u.id())||me.id||'local'}catch(e){}}
  if(db){C.db=db;['cards','groups','posts','biblio','history','dreams','pareceres','games'].forEach(n=>col(n).onSnapshot(s=>{S.st[n]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
   userSub();C.db.collection('data/users/'+C.uid).doc('progress').onSnapshot(s=>{if(s.exists)S.prog={xp:0,got:[],...s.data()};render()},()=>{})}
  else{S.st.cards=SEED.map((s,i)=>({id:'s'+i,...s,status:'publicada',author:'sys',files:[],ts:0}));S.st.groups=[{id:'g1',name:'Amantes do Sono e Pesadelos',theme:'Sono e Pesadelos',desc:'Conversas sobre mitos e relatos noturnos.',members:[],owner:'sys'}]}
 }catch(e){}
 if(!C.db&&!S.st.cards.length){S.st.cards=SEED.map((s,i)=>({id:'s'+i,...s,status:'publicada',author:'sys',files:[],ts:0}));S.st.groups=[{id:'g1',name:'Amantes do Sono e Pesadelos',theme:'Sono e Pesadelos',desc:'Conversas sobre mitos e relatos noturnos.',members:[],owner:'sys'}]}
 render()})();
