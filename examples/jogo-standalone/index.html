<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caça às Estrelas</title>
<style>html,body{margin:0;height:100%;background:#0b1026;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%;cursor:crosshair}#hud{position:fixed;top:10px;left:14px;font-size:20px}#msg{position:fixed;inset:0;display:grid;place-items:center;font-size:28px;text-align:center;background:rgba(0,0,0,.55)}button{font-size:20px;padding:10px 22px;border-radius:10px;border:0;background:#ffd24d;color:#1b1500;font-weight:700;cursor:pointer}</style></head>
<body><canvas id="c"></canvas><div id="hud"></div><div id="msg"><div id="box">Caça às Estrelas<br><small>Clique nas estrelas em 20 segundos</small><br><br><button id="go">Jogar</button></div></div>
<script>const c=document.getElementById('c'),g=c.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('msg'),box=document.getElementById('box');let W,H,stars=[],score=0,t0=0,run=false;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',rs);rs();
function spawn(){stars.push({x:Math.random()*W,y:-20,v:60+Math.random()*120,r:12+Math.random()*14})}
c.addEventListener('pointerdown',e=>{if(!run)return;for(let i=stars.length-1;i>=0;i--){const s=stars[i];if(Math.hypot(s.x-e.clientX,s.y-e.clientY)<s.r+8){stars.splice(i,1);score++;break}}});
function start(){score=0;stars=[];t0=performance.now();run=true;msg.style.display='none'}
document.getElementById('go').onclick=start;
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;g.fillStyle='#0b1026';g.fillRect(0,0,W,H);
if(run){if(Math.random()<dt*3)spawn();const left=Math.max(0,20-(t-t0)/1000);hud.textContent='Pontos: '+score+'  ·  Tempo: '+left.toFixed(0)+'s';if(left<=0){run=false;msg.style.display='grid';box.innerHTML='Fim! Você fez '+score+' pontos.<br><br><button id="go2">Jogar de novo</button>';document.getElementById('go2').onclick=start}}
stars.forEach(s=>{s.y+=s.v*dt;g.fillStyle='#ffd24d';g.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?s.r*.45:s.r;g.lineTo(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r)}g.closePath();g.fill()});stars=stars.filter(s=>s.y<H+30);requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
